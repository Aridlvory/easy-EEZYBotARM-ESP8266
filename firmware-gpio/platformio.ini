; easyEEZYbotARM ESP8266 WiFi control - PlatformIO project

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2          ; change to d1_mini / esp12e etc. if you're on a different board
framework = arduino

monitor_speed = 115200

; No lib_deps needed - ESP8266Servo ships with the espressif8266
; Arduino framework automatically.
; (If you still have the PCA9685 version around, that one needs:
;   lib_deps = adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2 )
